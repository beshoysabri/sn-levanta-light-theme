name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# theme is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the theme is internally consistent
        run: |
          set -euo pipefail

          EXT=$(python3 -c "import json;print(json.load(open('ext.json'))['version'])")
          PKG=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          if [ "$EXT" != "$PKG" ]; then
            echo "::error::version drift — ext.json=$EXT package.json=$PKG"
            exit 1
          fi

          for f in InterVariable.woff2 InterVariable-Italic.woff2 \
                   Karla.woff2 Karla-Italic.woff2 \
                   IBMPlexSansArabic-Regular.woff2 IBMPlexSansArabic-Bold.woff2 \
                   LevantaArrows-Regular.woff2 LevantaArrows-Bold.woff2 \
                   LevantaArrows-Regular.ttf LevantaArrows-Bold.ttf; do
            test -s "dist/fonts/$f" || { echo "::error::missing dist/fonts/$f"; exit 1; }
          done

          python3 - <<'PY'
          import re, sys, hashlib

          css = open('dist/dist.css').read()
          # Strip comments so the opt-in blocks in section 6 never count as live.
          stripped = re.sub(r'/\*.*?\*/', '', css, flags=re.S)

          def fail(msg):
              print(f'::error::{msg}')
              sys.exit(1)

          # Standard Notes inlines theme CSS rather than linking it, so a
          # relative @font-face src resolves against the app's own origin and
          # 404s. v2.2.0 shipped that bug. Every src must be absolute.
          BASE = 'https://beshoysabri.github.io/sn-levanta-light-theme/dist/fonts'
          for face in ('InterVariable.woff2', 'InterVariable-Italic.woff2',
                       'Karla.woff2', 'Karla-Italic.woff2',
                       'IBMPlexSansArabic-Regular.woff2', 'IBMPlexSansArabic-Bold.woff2',
                       'LevantaArrows-Regular.woff2', 'LevantaArrows-Bold.woff2'):
              if f"url('{BASE}/{face}')" not in stripped:
                  fail(f'@font-face src for {face} is not the absolute Pages URL')

          # Every colour must stay byte-identical to the Lavender Light palette
          # (white base and #6d61d1 accent since v2.7.0). Digesting only
          # the --sn-stylekit-* names covered 51 of 93 custom properties and left
          # 39 real colours unguarded — navigation, items column, editor,
          # titlebar, text selection, popover. The 3 --sn-inter-* and the 2
          # --levanta-* typography knobs are the only custom properties
          # deliberately excluded. Changing a colour on purpose means
          # updating EXPECTED in the same commit; a failed run prints the
          # new digest.
          decls = [(k, ' '.join(v.split()))
                   for k, v in re.findall(r'(--[\w-]+)\s*:\s*([^;]+);', stripped)
                   if not k.startswith(('--sn-inter-', '--levanta-'))]
          if len(decls) != 90:
              fail(f'expected 90 colour declarations, found {len(decls)}')
          digest = hashlib.sha256('\n'.join(f'{k}={v}' for k, v in decls).encode()).hexdigest()
          EXPECTED = '1cf40e5bbb68f6a909905bf4df8366c66ab3be6fbcdd9529b42dc3aa0c8f662d'
          if digest != EXPECTED:
              fail(f'colours changed — digest {digest} != expected {EXPECTED}')

          # A font that is declared but never applied is the v2.2.0 bug wearing
          # a different hat: CI stayed green while nothing actually rendered.
          if 'font-family: var(--sn-inter-font) !important' not in stripped:
              fail('nothing applies --sn-inter-font — the app-wide rule is gone')
          if not re.search(r'html\s*,\s*body\s*,\s*body\s*\*', stripped):
              fail('the app-wide selector (html, body, body *) is missing')

          # The same for the writing area: Karla and Plex must reach Super
          # and the plain-text editor, and code inside them must stay mono.
          if 'font-family: var(--levanta-text-font) !important' not in stripped:
              fail('nothing applies --levanta-text-font — the editor rule is gone')
          for sel in ('#super-editor-content *', '.ContentEditable__root *', '#note-text-editor'):
              if sel not in stripped:
                  fail(f'the editor rule no longer covers {sel}')
          if ':is(#super-editor-content, .ContentEditable__root) :is(pre, code' not in stripped:
              fail('code inside the editor is no longer kept monospace')

          # Note: the Daily view and selection rules (sections 5 and 6) must
          # reference variables rather than declare new ones. No separate check
          # is needed — a declaration would push the count to 91 and break the
          # digest above.

          # The section 7 opt-ins must stay commented out.
          if 'font-family: revert' in stripped:
              fail('the "system font outside the editor" opt-in block is uncommented')

          # Count braces on the stripped source; counting the raw file also
          # counts braces inside the commented-out blocks and hides a real
          # imbalance behind them.
          if stripped.count('{') != stripped.count('}'):
              fail('unbalanced braces in dist.css')

          print(f'dist.css ok — {len(decls)} colours unchanged, Inter and the writing fonts applied, absolute srcs, braces balanced')
          PY

          echo "ok — publishing v$EXT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
